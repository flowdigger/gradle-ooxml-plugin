import org.gradle.api.GradleException
plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.maven-publish'
        id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'org.flowdigger.dependency-check'
    id 'com.github.spotbugs' version '6.1.0'
}

configurations {
    xjcTool
}

group = 'org.flowdigger.gradle'
version = '1.0.2'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation 'org.docx4j:docx4j-core:17.0.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.openpnp:opencv:4.9.0-0'
    implementation 'ai.djl:api:0.33.0'
    implementation 'org.flowdigger:xir-sax:1.0.1'

    runtimeOnly 'ai.djl.onnxruntime:onnxruntime-engine:0.33.0'
    runtimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.20.0'

    xjcTool 'org.glassfish.jaxb:jaxb-xjc:4.0.5'

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

def generatedJaxbDir = layout.buildDirectory.dir('generated/sources/xjc/main')

tasks.register('generateCanonicalJaxb', JavaExec) {
    group = 'build'
    description = 'Generates JAXB classes from canonical.xsd into a dedicated generated package.'
    classpath = configurations.xjcTool
    mainClass = 'com.sun.tools.xjc.XJCFacade'
    inputs.file(file('src/main/resources/schema/canonical.xsd'))
    outputs.dir(generatedJaxbDir)

    doFirst {
        generatedJaxbDir.get().asFile.mkdirs()
    }

    args(
            '-extension',
            '-no-header',
            '-encoding', 'UTF-8',
            '-d', generatedJaxbDir.get().asFile.absolutePath,
            '-p', 'org.flowdigger.gradle.ooxml.generated.canonical',
            file('src/main/resources/schema/canonical.xsd').absolutePath
    )
}

sourceSets {
    main {
        java.srcDir(generatedJaxbDir)
    }

}

tasks.named('compileJava') {
    dependsOn tasks.named('generateCanonicalJaxb')
}

def dependencyCheckSuppression = file('dependency-check-suppressions.xml')

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn tasks.named('generateCanonicalJaxb')
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-ooxml-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-ooxml-plugin.git'

    plugins {
        ooxmlPlugin {
            id = 'org.flowdigger.ooxml'
            implementationClass = 'org.flowdigger.gradle.ooxml.OoXmlPlugin'
            displayName = 'OOXML Canonical Plugin'
            description = 'Converts DOCX/PPTX/XLSX to canonical XML and extracts assets.'
            tags = ['ooxml', 'docx4j', 'jaxb', 'docx', 'pptx', 'xlsx', 'xml']
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'OOXML Canonical Plugin'
            description = 'Gradle plugin for OOXML canonicalization and asset extraction'
            url = 'https://github.com/flowdigger/gradle-ooxml-plugin'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                }
            }

            developers {
                developer {
                    id = 'flowdigger'
                    name = 'Flowdigger'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/flowdigger/gradle-ooxml-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-ooxml-plugin.git'
                url = 'https://github.com/flowdigger/gradle-ooxml-plugin'
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.withType(Javadoc).configureEach {
    // Generated JAXB sources and data-model POJOs intentionally keep minimal docs.
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
