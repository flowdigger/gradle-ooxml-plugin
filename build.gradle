import org.gradle.api.GradleException
import java.security.MessageDigest
plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
}

configurations {
    xjcTool
}

group = 'org.flowdigger.gradle'
version = '1.0.1'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation 'org.docx4j:docx4j-core:17.0.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.openpnp:opencv:4.9.0-0'
    implementation 'ai.djl:api:0.33.0'
    implementation 'org.flowdigger:xir-sax:1.0.1'

    runtimeOnly 'ai.djl.onnxruntime:onnxruntime-engine:0.33.0'
    runtimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.20.0'

    xjcTool 'org.glassfish.jaxb:jaxb-xjc:4.0.5'

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

def generatedJaxbDir = layout.buildDirectory.dir('generated/sources/xjc/main')

tasks.register('generateCanonicalJaxb', JavaExec) {
    group = 'build'
    description = 'Generates JAXB classes from canonical.xsd into a dedicated generated package.'
    classpath = configurations.xjcTool
    mainClass = 'com.sun.tools.xjc.XJCFacade'
    inputs.file(file('src/main/resources/schema/canonical.xsd'))
    outputs.dir(generatedJaxbDir)

    doFirst {
        generatedJaxbDir.get().asFile.mkdirs()
    }

    args(
            '-extension',
            '-no-header',
            '-encoding', 'UTF-8',
            '-d', generatedJaxbDir.get().asFile.absolutePath,
            '-p', 'org.flowdigger.gradle.ooxml.generated.canonical',
            file('src/main/resources/schema/canonical.xsd').absolutePath
    )
}

sourceSets {
    main {
        java.srcDir(generatedJaxbDir)
    }

}

tasks.named('compileJava') {
    dependsOn tasks.named('generateCanonicalJaxb')
}

def dependencyCheckSuppression = file('dependency-check-suppressions.xml')
dependencyCheck {
    formats = ['HTML', 'JSON', 'XML']
    failBuildOnCVSS = 7.0
    if (dependencyCheckSuppression.exists()) {
        suppressionFile = dependencyCheckSuppression.absolutePath
    }
    analyzers {
        ossIndex {
            enabled = false
        }
    }
    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
    }
}

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn tasks.named('generateCanonicalJaxb')
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-ooxml-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-ooxml-plugin.git'

    plugins {
        ooxmlPlugin {
            id = 'org.flowdigger.gradle.ooxml'
            implementationClass = 'org.flowdigger.gradle.ooxml.OoXmlPlugin'
            displayName = 'OOXML Canonical Plugin'
            description = 'Converts DOCX/PPTX/XLSX to canonical XML and extracts assets.'
            tags = ['ooxml', 'docx4j', 'jaxb', 'docx', 'pptx', 'xlsx', 'xml']
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'OOXML Canonical Plugin'
            description = 'Gradle plugin for OOXML canonicalization and asset extraction'
            url = 'https://github.com/flowdigger/gradle-ooxml-plugin'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                }
            }

            developers {
                developer {
                    id = 'flowdigger'
                    name = 'Flowdigger'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/flowdigger/gradle-ooxml-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-ooxml-plugin.git'
                url = 'https://github.com/flowdigger/gradle-ooxml-plugin'
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.withType(Javadoc).configureEach {
    // Generated JAXB sources and data-model POJOs intentionally keep minimal docs.
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}


signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull
    def validKeyIdPattern = ~/(?i)^[0-9a-f]{8}([0-9a-f]{8})?$/
    def normalizedSigningKeyId = signingKeyId
            ?.trim()
            ?.replaceFirst(/^(?i)0x/, '')
    if (!(normalizedSigningKeyId ==~ validKeyIdPattern)) {
        normalizedSigningKeyId = null
    }

    if (signingKey && signingPassword) {
        if (normalizedSigningKeyId) {
            useInMemoryPgpKeys(normalizedSigningKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }

    sign publishing.publications
}


def centralStagingRoot = layout.buildDirectory.dir('central-staging-repo')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')
    into(centralStagingRoot)

    publishing.publications.withType(MavenPublication).all { publication ->
        def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
        from(file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")) {
            into(publicationPath)
        }
    }

    doFirst {
        publishing.publications.withType(MavenPublication).each { publication ->
            def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
            def localPublicationDir = file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")
            if (!localPublicationDir.exists()) {
                throw new GradleException("Expected local Maven publication directory not found: ${localPublicationDir}")
            }
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')

    doLast {
        def stagedRepoDir = centralStagingRoot.get().asFile
        if (!stagedRepoDir.exists()) {
            throw new GradleException("Expected staged repository directory not found: ${stagedRepoDir}")
        }

        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedRepoDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
